<header class="site-head">
  <div class="wrap head-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-name">{{ site.author.name }}</span>
      <span class="brand-role">{{ site.author.field }} · {{ site.author.institution }}</span>
    </a>
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav">
      {%- for item in site.data.navigation -%}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor -%}
    </nav>
  </div>
</header>
