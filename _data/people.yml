# ------------------------------------------------------------
# GROUP & COLLABORATORS
# Listing people publicly is your call — please confirm names
# with each person before publishing. The group entries below
# are drafts for you to review, edit, or delete.
#
# Fields:
#   name     – displayed name
#   role     – short role line (rendered in mono type)
#   focus    – one-sentence research focus (optional)
#   link     – shorthand for a single link, labelled "Website".
#              Leave blank and use `links` instead when there's more
#              than one, or when "Website" is the wrong label.
#   links    – any number of labelled links, each with a label and url:
#                links:
#                  - label: Personal site
#                    url: https://example.com
#                  - label: Lab website
#                    url: https://lab.example.edu
#                  - label: Google Scholar
#                    url: https://scholar.google.com/citations?user=XXXX
#              Label them however you like — "Lab website", "ORCID",
#              "CV", "GitHub". A link with no label falls back to its
#              domain name. `link` and `links` can be used together:
#              `link` simply renders first.
#   photo    – headshot path, e.g. /assets/img/headshot_2026.jpg
#              Add the file to assets/img/ first. Square-ish crops look
#              best; leave blank to show a neutral placeholder avatar.
#   projects – list of project `slug` values from _data/projects.yml.
#              Each renders as a tag linking to that thread on the
#              Research page. A slug with no match renders as plain text,
#              so you can also list work that isn't a project entry.
# ------------------------------------------------------------

