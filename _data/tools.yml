# ------------------------------------------------------------
# TOOLS, WEBSITES & DATA PRODUCTS
# Anything worth sending someone to: a package, a project site,
# a dataset landing page, a dashboard.
#
# Fields:
#   name     – displayed name
#   featured – true shows it on the home page
#   lang     – small chip, e.g. "Python" or "Web". Omit it (or leave
#              blank) and no chip renders — useful for websites.
#   summary  – a sentence or two
#   repo     – shorthand for a single GitHub link; renders first as
#              "View on GitHub". Leave blank for non-code entries.
#   links    – any number of extra links, each with a label and url:
#                links:
#                  - label: Project site
#                    url: https://example.org
#                  - label: Documentation
#                    url: https://example.org/docs
#              A link with no label falls back to its domain name.
#              Use this alone (no `repo`) for website-only entries.
# ------------------------------------------------------------

- name: ModelObsCompare
  featured: true
  lang: Python, Jupyter
  repo: https://github.com/michaleaking/ModelObsCompare
  #links:
  #  - label: Documentation and Use
  #    url: https://github.com/michaleaking/ModelObsCompare/
  summary: >-
    moc (Model vs Observation Glacier Velocity Comparison Module) compares observed surface velocities against 
    modelled velocities from ISSM over glacier basins of interest on the Greenland Ice Sheet.

- name: fluxgate-tools
  featured: true
  lang: Python
  repo: https://github.com/your-github-username/fluxgate-tools
  summary: >-
    Interactive drawing of flux gates across glacier trunks for ice-discharge
    estimates, packaged as an installable src-layout module.



