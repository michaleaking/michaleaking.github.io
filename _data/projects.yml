# Research threads. Set `featured: true` to show a thread on the home page.
# `tags` render as small labels. `data` lists the datasets each thread leans on.
#
# `links` adds any number of links under a thread's description on the
# Research page — a project site, a paper, a data release, a proposal
# abstract. Each takes a label and a url; a link with no label falls back
# to its domain name:
#
#   links:
#     - label: Project site
#       url: https://example.org
#     - label: NASA award
#       url: https://example.gov/award

- title: Mapping Greenland interior ice flow with NISAR
  slug: greenland-nisar
  featured: true
  summary: >-
    How calving at marine-terminating outlet glaciers drives transitions in
    subglacial hydrology. This thread pairs satellite remote sensing with
    ice-sheet modelling, including science questions enabled by NISAR (the
    NASA-ISRO Synthetic Aperture Radar mission). This research is 
    supported by NASA Cryosphere.
  tags: [NASA,Remote sensing, Ice-sheet modelling, ISSM]
  data: [GrIMP, BedMachine, ICESat-2, NISAR]
  links:
    - label: NISAR mission
      url: https://nisar.jpl.nasa.gov/

