- title: Mapping mélange in Greenland fjords
  slug: melange-fjord
  featured: true
  summary: >-
     This works adapts glacier velocity mapping techniques to better understand the 
     spatiotemporal variability of ice mélange, the dense mix of icebergs and sea ice packed 
     into glacial fjords, and how it couples to terminus stability and calving at the ice-ocean 
     boundary. This research is supported by NSF Arctic Natural Sciences.
  tags: [Fjord processes, Calving]
  data: [GrIMP, ArcticDEM]

- title: Seasonal glacier dynamics using ICESat-2
  slug: icesat2-seasonal
  featured: true
  summary: >-
    Seasonal patterns in glacier terminus position and the hydraulic-potential
    fields that route water beneath the ice, built into reproducible tools for
    tracing meltwater pathways from bed and surface topography. This research is 
    supported by NASA A.32: Studies with ICESat-2.
  tags: [Seasonality, Meltwater routing]
  data: [BedMachine, ArcticDEM, RACMO]

- title: Paatuut — landslides and permafrost
  slug: paatuut
  featured: false
  summary: >-
    A field-site collaboration at Paatuut, West Greenland, analysing landslide
    and permafrost dynamics with pyTopoComplexity and Landlab, in partnership
    with Greenland-based and University of Washington colleagues.
  tags: [Permafrost, Geomorphology, Field]
  data: [ArcticDEM]
